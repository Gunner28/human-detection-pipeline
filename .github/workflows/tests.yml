# Runs the test suite on every push and pull request.
#
# The suite needs no model weights and no dataset — every test builds its
# own synthetic input — so this completes in seconds and cannot fail
# because a download was slow or a benchmark file was missing.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # headless: the runner has no display, and importing the desktop
          # build of OpenCV fails there rather than degrading.
          pip install opencv-python-headless numpy matplotlib scipy pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check the package imports without optional dependencies
        # ultralytics and torch are deliberately not installed above. The
        # SSD path must work without them, so this fails if a YOLO import
        # ever escapes to module scope.
        run: |
          python -c "
          from humandetect import analytics, counting, evaluate, mot17, tracking
          from humandetect.benchmark import BenchmarkConfig
          print('core package imports cleanly without ultralytics')
          "
